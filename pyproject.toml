[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbroko"
version = "1.0.1"
description = "AgentBroko skills hub with local-first Video Forge video editing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Broke Innovation", email = "brokeinnovation@gmail.com" }]
keywords = ["video-editing", "ffmpeg", "text-to-speech", "offline", "ai-agent"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
]

[project.scripts]
agentbroko = "agentbroko.cli:main"
video-forge = "video_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
